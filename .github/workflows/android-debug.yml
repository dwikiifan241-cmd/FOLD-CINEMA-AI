
name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: |
          yes | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

     
      - name: Prepare Android debug keystore directory
        run: |
          mkdir -p "$HOME/.config/.android"
          chmod -R u+rwX "$HOME/.config/.android"

      - name: Build APK
        run: gradle assembleDebug


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FoldCinemaAI-Debug
          path: app/build/outputs/apk/debug/*.apk
